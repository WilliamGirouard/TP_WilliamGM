name: CI
on:
  push:
    branches: [ main, master ]
    tags: 
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
            java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Fournir access au runner
        run: chmod +x mvnw

      - name: Compilation du projet Maven
        run: ./mvnw compile

      - name: Build and run tests
        run: ./mvnw -B clean verify

      - name: Publier le .jar en artefact
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
            name: application-jar
            path: target/*.jar  
      - name: Publier le  rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: rapport-jacoco-jdk${{matrix.java}}
            path: target/site/jacoco/
  build-and-push-image:
    needs: build-and-test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le .jar déjà construit (aucune recompilation ici)
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GHCR }}
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convertir le nom du compte/organisation en minuscules
        run: echo "OWNER_LC=${USERNAME_GIT,,}" >> "$GITHUB_ENV"
        env: 
          USERNAME_GIT: ${{ vars.USERNAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.GHCR }}/${{ env.OWNER_LC }}/biblio-api:${{ github.ref_name }}
  release:
    needs: build-and-test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le .jar déjà construit (aucune recompilation ici)
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: target/*.jar